<!DOCTYPE html>
<html lang="es">
<head>
<script>
/* Fuera de Claude: guarda en este navegador y descarga archivos normal. */
(function(){ if (window.claude) return;
  window.claude = { use: function(n){ return Promise.resolve(n !== 'downloads' ? null : { save: function(o){
    try { var b = o.data instanceof Blob ? o.data : new Blob([o.data]); var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = o.filename; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return Promise.resolve({status:'saved'}); } catch(e){ return Promise.reject({code:'unavailable', message:String(e)}); } } }); } };
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbe3f0">
<meta name="color-scheme" content="light">
<title>Retoques · Salón Laura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #fbe8f2;
    --bg-2: #f6dcec;
    --card: #ffffff;
    --ink: #3a2233;
    --muted: #94788a;
    --pink: #e0337e;
    --pink-dark: #c2246a;
    --pink-soft: #fde4ef;
    --lilac: #efe2fb;
    --green: #2fbf5a;
    --green-dark: #23a24a;
    --yellow: #f0a91b;
    --yellow-soft: #fff1d9;
    --red: #d8264f;
    --red-soft: #fde1e7;
    --ok-soft: #e1f6e7;
    --radius: 22px;
    --shadow: 0 6px 22px rgba(176, 52, 112, 0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #f3d6e6;
    color: var(--ink);
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button, input, a { font-family: inherit; }
  :focus-visible { outline: 3px solid #7a3cf0; outline-offset: 2px; border-radius: 10px; }

  .app {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    padding: 22px 16px 120px;
    position: relative;
  }
  @media (min-width: 520px) {
    body { padding: 24px 0; }
    .app { min-height: calc(100vh - 48px); border-radius: 34px; box-shadow: 0 20px 60px rgba(120, 30, 80, 0.18); }
  }

  /* Header */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .salon { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 2px; }
  h1 { font-size: 28px; line-height: 1.1; margin: 0; font-weight: 700; color: #2c1426; }
  .me {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-weight: 600; color: var(--pink-dark);
    background: var(--pink-soft); border: 2px solid #fff; box-shadow: var(--shadow);
  }

  /* Aviso de datos de ejemplo */
  .demo-note {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: rgba(255, 255, 255, 0.75); border: 1.5px dashed #ecc3d8; border-radius: 16px;
    padding: 9px 10px 9px 14px; margin-bottom: 14px; font-size: 13px; color: #6f4a62;
  }
  .demo-note[hidden] { display: none; }
  .demo-note button {
    border: 0; background: var(--pink-soft); color: var(--pink-dark); font-weight: 600; font-size: 12.5px;
    border-radius: 999px; padding: 7px 12px; cursor: pointer;
  }
  .demo-note button:hover { background: #fbd3e5; }

  /* Summary */
  .summary {
    background: linear-gradient(140deg, #f9c9e1 0%, #f3d3f1 60%, #ead9fb 100%);
    border-radius: 26px; padding: 18px 18px 16px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
  }
  .sum-count { font-size: 40px; font-weight: 700; line-height: 1; color: var(--pink-dark); }
  .sum-label { font-size: 14px; color: #6f4a62; margin-top: 4px; }
  .sum-divider { grid-column: 1 / -1; height: 1px; background: rgba(160, 60, 120, 0.15); margin: 8px 0 6px; }
  .sum-money { grid-column: 1 / -1; font-size: 26px; font-weight: 700; color: #2c1426; line-height: 1.1; }
  .sum-money-label { grid-column: 1 / -1; font-size: 13px; color: #6f4a62; }
  .ring { position: relative; width: 66px; height: 66px; }
  .ring svg { width: 66px; height: 66px; transform: rotate(-90deg); display: block; }
  .ring-bg { fill: none; stroke: rgba(255, 255, 255, 0.75); stroke-width: 7; }
  .ring-fg { fill: none; stroke: var(--pink); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
  .ring-txt { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--pink-dark); }

  /* Tabs */
  .tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 18px 0 14px;
    background: rgba(255, 255, 255, 0.6); border-radius: 999px; padding: 4px;
  }
  .tab {
    border: 0; background: transparent; padding: 10px 8px; border-radius: 999px;
    font-size: 14px; font-weight: 600; color: #7a5a6e; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--pink); color: #fff; box-shadow: 0 4px 12px rgba(224, 51, 126, 0.35); }
  .tab .n { font-weight: 500; opacity: 0.8; }

  /* Cards */
  .list { display: grid; gap: 14px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px 14px 14px; box-shadow: var(--shadow); cursor: pointer; }
  .card-head { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: inherit; }
  .avatar {
    width: 44px; height: 44px; border-radius: 14px; flex: none; display: grid; place-items: center;
    background: var(--pink-soft); color: var(--pink-dark); font-weight: 600; font-size: 15px;
  }
  .who { flex: 1; min-width: 0; }
  .name { display: block; font-weight: 600; font-size: 16px; color: #2c1426; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .color { font-size: 13px; color: var(--muted); }
  .pill { flex: none; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: #1e8a42; }
  .pill.due { background: var(--yellow-soft); color: #b06f00; }
  .pill.late { background: var(--red-soft); color: var(--red); }

  .timeline { margin: 14px 2px 4px; }
  .track { position: relative; height: 8px; border-radius: 999px; background: #f1e5ec; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
  .fill.ok { background: var(--green); }
  .fill.due { background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 100%); }
  .fill.late { background: linear-gradient(90deg, var(--green) 0%, var(--yellow) 55%, var(--red) 100%); }
  .dot {
    position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%);
    background: #fff; border: 3px solid #e6d3de;
  }
  .dot.d0 { left: 0; transform: translate(0, -50%); }
  .dot.d2 { left: auto; right: 0; transform: translate(0, -50%); }
  .dot.on-ok { border-color: var(--green); }
  .dot.on-due { border-color: var(--yellow); }
  .dot.on-late { border-color: var(--red); }
  .tl-labels { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .tl-labels span:nth-child(2) { text-align: center; }
  .tl-labels span:nth-child(3) { text-align: right; }
  .tl-labels b { display: block; font-weight: 600; color: #6d5163; font-size: 11.5px; }
  .meta { display: flex; justify-content: space-between; gap: 4px 8px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }

  .money {
    margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--pink-soft); border-radius: 14px; padding: 10px 12px;
  }
  .money.ok { background: #f4eef8; }
  .money-label { font-size: 12.5px; color: #8a5d77; }
  .money-val { font-size: 19px; font-weight: 700; color: var(--pink-dark); white-space: nowrap; }
  .money.ok .money-val { color: #5a3f6e; }

  .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
  .wa {
    display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    background: var(--green); color: #fff; font-weight: 600; font-size: 14.5px; border-radius: 14px; padding: 12px 10px;
    box-shadow: 0 4px 12px rgba(47, 191, 90, 0.3);
  }
  .wa:hover { background: var(--green-dark); }
  .wa svg { width: 18px; height: 18px; flex: none; }
  .came {
    border: 1.5px solid #ead3e0; background: #fff; color: #7a4a66; font-weight: 600; font-size: 13.5px;
    border-radius: 14px; padding: 0 14px; cursor: pointer; white-space: nowrap;
  }
  .came:hover { background: #fff6fa; }
  .wa-num { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .empty { text-align: center; padding: 34px 20px; background: rgba(255, 255, 255, 0.7); border-radius: var(--radius); color: #7a5a6e; }
  .empty strong { display: block; font-size: 16px; color: #2c1426; margin-bottom: 4px; }

  .saved { text-align: center; font-size: 11.5px; color: var(--muted); margin: 18px 0 0; }
  .saved::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #c9a9bb; margin-right: 6px; vertical-align: 1px; }
  .saved.nube::before { background: var(--green); }

  /* FAB */
  .fab-wrap { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; pointer-events: none; z-index: 5; }
  .fab {
    pointer-events: auto; border: 0; background: var(--pink); color: #fff; font-weight: 600; font-size: 15px;
    padding: 14px 26px; border-radius: 999px; cursor: pointer; box-shadow: 0 10px 24px rgba(224, 51, 126, 0.45);
  }
  .fab:hover { background: var(--pink-dark); }

  /* Sheet */
  .overlay {
    position: fixed; inset: 0; background: rgba(60, 20, 45, 0.38); z-index: 20;
    display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.2s ease;
  }
  .overlay[hidden] { display: none; }
  .overlay.show { opacity: 1; }
  .sheet {
    width: 100%; max-width: 460px; background: #fff; border-radius: 28px 28px 0 0; padding: 10px 18px 22px;
    max-height: 92vh; overflow-y: auto; transform: translateY(30px); transition: transform 0.25s ease;
  }
  .overlay.show .sheet { transform: translateY(0); }
  .grab { width: 44px; height: 5px; border-radius: 99px; background: #ead3e0; margin: 0 auto 12px; }
  .sheet h2 { margin: 0 0 14px; font-size: 20px; color: #2c1426; }
  .field { margin-bottom: 12px; min-width: 0; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: #6d5163; margin-bottom: 5px; }
  .field input {
    width: 100%; font-size: 16px; color: var(--ink); background: #fdf5f9; border: 1.5px solid #f0dbe6;
    border-radius: 14px; padding: 11px 12px; min-height: 46px;
  }
  .field input:focus { border-color: var(--pink); outline: none; box-shadow: 0 0 0 3px rgba(224, 51, 126, 0.2); }
  .field input[aria-invalid="true"] { border-color: var(--red); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
  .err { color: var(--red); font-size: 12.5px; min-height: 18px; margin: 2px 0 8px; }
  .sheet-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border: 0; border-radius: 14px; padding: 13px 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: #f6eaf1; color: #6d5163; }
  .btn.primary { background: var(--pink); color: #fff; }
  .btn.primary:hover { background: var(--pink-dark); }
  .btn.danger { grid-column: 1 / -1; background: #fff; color: var(--red); border: 1.5px solid #f4c4d1; }
  .btn.danger[data-ok="1"] { background: var(--red); color: #fff; border-color: var(--red); }

  .toast {
    position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); background: #2c1426; color: #fff;
    font-size: 13.5px; padding: 10px 16px; border-radius: 999px; z-index: 30; opacity: 0; transition: opacity 0.2s ease;
    pointer-events: none; width: max-content; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <p class="salon">Salón Laura</p>
      <h1>Retoques</h1>
    </div>
    <div class="me" aria-hidden="true">L</div>
  </header>

  <div class="demo-note" id="demoNote" hidden>
    <span>Estás viendo datos de ejemplo</span>
    <button type="button" id="btnClearDemo">Borrar ejemplos y empezar</button>
  </div>

  <section class="summary" aria-label="Resumen">
    <div>
      <div class="sum-count" id="sumCount">0</div>
      <div class="sum-label" id="sumLabel">clientas para avisar este mes</div>
    </div>
    <div class="ring" id="ring" role="img" aria-label="">
      <svg viewBox="0 0 66 66" aria-hidden="true">
        <circle class="ring-bg" cx="33" cy="33" r="27"></circle>
        <circle class="ring-fg" id="ringFg" cx="33" cy="33" r="27"></circle>
      </svg>
      <span class="ring-txt" id="ringTxt" aria-hidden="true">0/0</span>
    </div>
    <div class="sum-divider"></div>
    <div class="sum-money" id="sumMoney">B/. 0.00</div>
    <div class="sum-money-label">en retoques para recuperar</div>
  </section>

  <div class="tabs" role="tablist" aria-label="Filtrar clientas">
    <button class="tab" role="tab" id="tabDue" aria-selected="true" aria-controls="list" type="button">Para avisar <span class="n" id="nDue"></span></button>
    <button class="tab" role="tab" id="tabAll" aria-selected="false" aria-controls="list" type="button">Todas <span class="n" id="nAll"></span></button>
  </div>

  <section class="list" id="list" role="tabpanel" aria-live="polite"></section>

  <p class="saved" id="saved">Se guarda en este equipo</p>
</main>

<div class="fab-wrap">
  <button class="fab" id="fab" type="button">+ Agregar clienta</button>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="sheetTitle">Nueva clienta</h2>
    <form id="form" novalidate>
      <div class="field">
        <label for="fName">Nombre</label>
        <input id="fName" name="name" type="text" autocomplete="off" placeholder="Ej: Ana Pérez" maxlength="60" required>
      </div>
      <div class="field">
        <label for="fPhone">Teléfono (WhatsApp)</label>
        <input id="fPhone" name="phone" type="tel" inputmode="tel" autocomplete="off" placeholder="Ej: 6123-4567" maxlength="20">
      </div>
      <div class="field">
        <label for="fColor">Color / servicio</label>
        <input id="fColor" name="color" type="text" autocomplete="off" placeholder="Ej: Rubio ceniza" maxlength="60">
      </div>
      <div class="field">
        <label for="fDate">Fecha del último tinte</label>
        <input id="fDate" name="date" type="date" required>
      </div>
      <div class="row2">
        <div class="field">
          <label for="fWeeks">Cada cuántas semanas vuelve</label>
          <input id="fWeeks" name="weeks" type="number" min="1" max="52" step="1" value="6" inputmode="numeric" required>
        </div>
        <div class="field">
          <label for="fPrice">Precio del retoque (B/.)</label>
          <input id="fPrice" name="price" type="number" min="0" step="0.01" inputmode="decimal" placeholder="45.00" required>
        </div>
      </div>
      <p class="err" id="err" role="alert"></p>
      <div class="sheet-btns">
        <button class="btn ghost" type="button" id="btnCancel">Cancelar</button>
        <button class="btn primary" type="submit">Guardar</button>
        <button class="btn danger" type="button" id="btnDelete" hidden>Eliminar clienta</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Store: guarda el estado de la app.
   - En Claude (artifact con capacidades db+user): en la nube, privado por usuario.
   - Fuera de Claude o sin sesión: en localStorage (si existe).
   Uso:
     Store.init('mi-app', function(state, origen){ ...render... });  // puede llamarse 2 veces: local y luego nube
     Store.save(state);   // con pausa de 600 ms; una escritura a la vez
     Store.mode()         // 'local' | 'nube'
*/
var Store = (function () {
  var key = null, ref = null, mode = 'local', timer = null, chain = Promise.resolve(), last = null, onLoadCb = null, dirty = false;
  function lsGet() { try { var s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function lsSet(v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function connect() {
    return new Promise(function (resolve) {
      if (!window.claude || typeof window.claude.use !== 'function') return resolve(false);
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; resolve(false); } }, 10000);
      Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
        var d = r[0], u = r[1];
        if (!d || !u) { done = true; clearTimeout(t); return resolve(false); }
        return u.id().then(function (id) {
          if (done) return;
          done = true; clearTimeout(t);
          if (!id) return resolve(false);
          ref = d.doc('data/users/' + id + '/' + key);
          resolve(true);
        });
      }).catch(function () { if (!done) { done = true; clearTimeout(t); resolve(false); } });
    });
  }
  function init(k, onLoad) {
    key = k; onLoadCb = onLoad;
    onLoad(lsGet(), 'local');
    connect().then(function (ok) {
      if (!ok) return;
      return ref.get().then(function (snap) {
        mode = 'nube';
        if (snap.exists) {
          var d = snap.data();
          if (d && typeof d.state === 'string' && !dirty) {
            try { var st = JSON.parse(d.state); lsSet(st); onLoadCb(st, 'nube'); } catch (e) {}
          }
        } else if (last) { write(last); }
        if (typeof Store.onMode === 'function') Store.onMode(mode);
      }).catch(function () { ref = null; mode = 'local'; });
    });
  }
  function write(state) {
    var body = { state: JSON.stringify(state), updatedAt: new Date().toISOString() };
    chain = chain.then(function () {
      if (!ref) return;
      return ref.set(body).catch(function (e) {
        if (e && e.code === 'quota_exceeded' && typeof Store.onError === 'function') Store.onError('Se llenó el espacio en la nube. Borra fotos o datos viejos.');
      });
    });
  }
  function save(state) {
    dirty = true; last = state; lsSet(state);
    clearTimeout(timer);
    timer = setTimeout(function () { write(last); }, 600);
  }
  return { init: init, save: save, mode: function () { return mode; }, onMode: null, onError: null };
})();

function dosToques(b) {
  if (b.dataset.ok === "1") { b.dataset.ok = ""; return true; }
  b.dataset.ok = "1";
  var t = b.textContent;
  b.textContent = "Toca otra vez para eliminar";
  setTimeout(function () { if (b.dataset.ok === "1") { b.dataset.ok = ""; b.textContent = t; } }, 3000);
  return false;
}

(function () {
  "use strict";
  var DAY = 86400000;
  var state = { v: 1, clientas: [] };
  var tab = "due";
  var editingId = null;

  // ---------- helpers ----------
  function today() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function toISO(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fromISO(s) {
    var p = String(s || "").split("-");
    if (p.length !== 3) return today();
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return isNaN(d.getTime()) ? today() : d;
  }
  function daysAgo(n) { var d = today(); d.setDate(d.getDate() - n); return toISO(d); }
  function diffDays(a, b) { return Math.round((b - a) / DAY); }
  function money(n) {
    n = Math.round((Number(n) || 0) * 100) / 100;
    var parts = Math.abs(n).toFixed(2).split(".");
    var s = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + parts[1];
    return (n < 0 ? "-B/. " : "B/. ") + s;
  }
  function fmtDate(d) {
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
  }
  function initials(name) {
    var parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    var s = parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "");
    return s.toUpperCase();
  }
  function firstName(name) { return String(name).trim().split(/\s+/)[0] || ""; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uid() { return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // Teléfono: solo dígitos; si no trae código de país (8 dígitos o menos) se le pone 507 (Panamá).
  function waPhone(raw) {
    var d = String(raw || "").replace(/\D/g, "");
    if (!d) return "";
    if (d.length <= 8) d = "507" + d;
    return d;
  }
  function phoneText(raw) {
    var d = waPhone(raw);
    if (!d) return "";
    if (d.indexOf("507") === 0 && d.length === 11) return "+507 " + d.slice(3, 7) + "-" + d.slice(7);
    if (d.indexOf("507") === 0 && d.length === 10) return "+507 " + d.slice(3, 6) + "-" + d.slice(6);
    return "+" + d;
  }

  // ---------- datos ----------
  function seed() {
    return [
      { id: uid(), ejemplo: true, name: "Yaritza Batista", phone: "6123-4501", color: "Rubio miel", last: daysAgo(56), weeks: 6, price: 55 },
      { id: uid(), ejemplo: true, name: "Marisol De Gracia", phone: "6234-1187", color: "Caoba", last: daysAgo(52), weeks: 6, price: 48.5 },
      { id: uid(), ejemplo: true, name: "Itzel Rodríguez", phone: "6578-0923", color: "Castaño chocolate", last: daysAgo(40), weeks: 6, price: 45 },
      { id: uid(), ejemplo: true, name: "Dayana Pinzón", phone: "6645-3310", color: "Balayage caramelo", last: daysAgo(45), weeks: 6, price: 120 },
      { id: uid(), ejemplo: true, name: "Yessenia Quintero", phone: "6890-2245", color: "Cubrir canas", last: daysAgo(30), weeks: 4, price: 35 },
      { id: uid(), ejemplo: true, name: "Kathia Samudio", phone: "6712-8854", color: "Negro azulado", last: daysAgo(14), weeks: 6, price: 40 },
      { id: uid(), ejemplo: true, name: "Milagros Herrera", phone: "6301-7762", color: "Mechas platino", last: daysAgo(20), weeks: 8, price: 85 },
      { id: uid(), ejemplo: true, name: "Anabel Castillo", phone: "6456-9031", color: "Rojo cobrizo", last: daysAgo(10), weeks: 5, price: 50 }
    ];
  }
  function clients() { return state.clientas; }
  function persist() { Store.save(state); }
  function find(id) {
    var list = clients();
    for (var k = 0; k < list.length; k++) if (list[k].id === id) return list[k];
    return null;
  }

  // ---------- estado (misma lógica de la demo) ----------
  function info(c) {
    var weeks = Math.max(1, parseInt(c.weeks, 10) || 6);
    var last = fromISO(c.last);
    var t = today();
    var elapsed = Math.max(0, diffDays(last, t));
    var cycle = weeks * 7;
    var due = new Date(last.getTime()); due.setDate(due.getDate() + cycle);
    var untilDue = diffDays(t, due); // >0 falta, <0 atrasada
    var status;
    if (untilDue < -7) status = "late";
    else if (untilDue <= 7) status = "due";
    else status = "ok";
    // Línea de tiempo: "Le toca volver" queda al 65%; el final es "No volvió"
    var total = cycle / 0.65;
    var pct = Math.min(100, (elapsed / total) * 100);
    if (status === "late") pct = Math.max(pct, 82);
    return {
      weeks: weeks, last: last, due: due, untilDue: untilDue, elapsed: elapsed,
      week: Math.floor(elapsed / 7), status: status, pct: pct
    };
  }
  var LABEL = { ok: "Al día", due: "Le toca", late: "Atrasada" };
  function dueText(i) {
    if (i.status === "ok") return "Le toca volver el " + fmtDate(i.due);
    if (i.untilDue > 0) return "Le toca en " + i.untilDue + (i.untilDue === 1 ? " día" : " días");
    if (i.untilDue === 0) return "Le toca hoy";
    var n = -i.untilDue;
    return "Debía volver hace " + n + (n === 1 ? " día" : " días");
  }

  function waLink(c, i) {
    var color = String(c.color || "").trim();
    var msg = "¡Hola " + firstName(c.name) + "! Te escribe Laura, del salón. " +
      "Ya pasaron " + i.week + (i.week === 1 ? " semana" : " semanas") + " desde tu último color" +
      (color ? " (" + color + ")" : "") +
      " y es un buen momento para el retoque, así queda impecable. ¿Te separo una cita esta semana?";
    return "https://wa.me/" + waPhone(c.phone) + "?text=" + encodeURIComponent(msg);
  }

  var WA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';

  // ---------- pintar ----------
  function render() {
    var withInfo = clients().map(function (c) { return { c: c, i: info(c) }; });
    var rank = { late: 0, due: 1, ok: 2 };
    withInfo.sort(function (a, b) {
      if (rank[a.i.status] !== rank[b.i.status]) return rank[a.i.status] - rank[b.i.status];
      return a.i.untilDue - b.i.untilDue;
    });
    var dueList = withInfo.filter(function (x) { return x.i.status !== "ok"; });
    var atStake = dueList.reduce(function (s, x) { return s + (Number(x.c.price) || 0); }, 0);

    document.getElementById("demoNote").hidden = !clients().some(function (c) { return c.ejemplo; });
    document.getElementById("sumCount").textContent = dueList.length;
    document.getElementById("sumLabel").textContent =
      (dueList.length === 1 ? "clienta para avisar este mes" : "clientas para avisar este mes");
    document.getElementById("sumMoney").textContent = money(atStake);
    document.getElementById("nDue").textContent = "(" + dueList.length + ")";
    document.getElementById("nAll").textContent = "(" + withInfo.length + ")";

    var total = withInfo.length;
    var frac = total ? dueList.length / total : 0;
    var C = 2 * Math.PI * 27;
    var fg = document.getElementById("ringFg");
    fg.setAttribute("stroke-dasharray", C.toFixed(2));
    fg.setAttribute("stroke-dashoffset", (C * (1 - frac)).toFixed(2));
    document.getElementById("ringTxt").textContent = dueList.length + "/" + total;
    document.getElementById("ring").setAttribute("aria-label", dueList.length + " de " + total + " clientas para avisar");

    var rows = tab === "due" ? dueList : withInfo;
    var list = document.getElementById("list");
    if (!rows.length) {
      list.innerHTML = (tab === "due" && total)
        ? '<div class="empty"><strong>¡Todo al día!</strong>Ninguna clienta necesita aviso por ahora.</div>'
        : '<div class="empty"><strong>Todavía no hay clientas</strong>Toca “+ Agregar clienta” para empezar.</div>';
      return;
    }
    list.innerHTML = rows.map(function (x) {
      var c = x.c, i = x.i, st = i.status;
      var ph = phoneText(c.phone);
      return '' +
        '<article class="card" data-id="' + esc(c.id) + '">' +
          '<button class="card-head" type="button" data-edit="' + esc(c.id) + '" aria-label="Editar ' + esc(c.name) + '">' +
            '<span class="avatar" aria-hidden="true">' + esc(initials(c.name)) + '</span>' +
            '<span class="who"><span class="name">' + esc(c.name) + '</span>' +
            '<span class="color">' + esc(c.color || "Sin color anotado") + '</span></span>' +
            '<span class="pill ' + st + '">' + LABEL[st] + '</span>' +
          '</button>' +
          '<div class="timeline" aria-label="Progreso: semana ' + i.week + ' de ' + i.weeks + '">' +
            '<div class="track">' +
              '<div class="fill ' + st + '" style="width:' + i.pct.toFixed(1) + '%"></div>' +
              '<span class="dot d0 on-ok"></span>' +
              '<span class="dot' + (st === "late" ? " on-late" : st === "due" ? " on-due" : "") + '" style="left:65%"></span>' +
              '<span class="dot d2' + (st === "late" ? " on-late" : "") + '"></span>' +
            '</div>' +
            '<div class="tl-labels">' +
              '<span><b>Se tiñó</b>Semana 0</span>' +
              '<span><b>Le toca volver</b>Semana ' + i.weeks + '</span>' +
              '<span><b>No volvió</b>+1 semana</span>' +
            '</div>' +
          '</div>' +
          '<div class="meta"><span>Último color: ' + fmtDate(i.last) + '</span><span>Semana ' + i.week + ' de ' + i.weeks + '</span></div>' +
          '<div class="money' + (st === "ok" ? " ok" : "") + '">' +
            '<span class="money-label">' + (st === "late" ? "Si vuelve esta semana" : esc(dueText(i))) + '</span>' +
            '<span class="money-val">' + money(c.price) + '</span>' +
          '</div>' +
          '<div class="actions">' +
            '<a class="wa" href="' + esc(waLink(c, i)) + '" target="_blank" rel="noopener">' + WA_ICON + 'Avisar por WhatsApp</a>' +
            '<button class="came" type="button" data-came="' + esc(c.id) + '">Ya vino</button>' +
          '</div>' +
          '<div class="wa-num">' + (ph ? "WhatsApp: " + esc(ph) : "Sin teléfono anotado") + '</div>' +
        '</article>';
    }).join("");
  }

  // ---------- aviso ----------
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  // ---------- hoja (agregar / editar) ----------
  var overlay = document.getElementById("overlay");
  var form = document.getElementById("form");
  var btnDelete = document.getElementById("btnDelete");
  var errBox = document.getElementById("err");
  var lastFocus = null;
  var F = {};
  ["fName", "fPhone", "fColor", "fDate", "fWeeks", "fPrice"].forEach(function (id) { F[id] = document.getElementById(id); });

  function clearInvalid() { Object.keys(F).forEach(function (k) { F[k].removeAttribute("aria-invalid"); }); }
  function openSheet(c) {
    lastFocus = document.activeElement;
    editingId = c ? c.id : null;
    document.getElementById("sheetTitle").textContent = c ? "Editar clienta" : "Nueva clienta";
    btnDelete.hidden = !c;
    btnDelete.dataset.ok = "";
    btnDelete.textContent = "Eliminar clienta";
    errBox.textContent = "";
    clearInvalid();
    F.fName.value = c ? c.name : "";
    F.fPhone.value = c ? (c.phone || "") : "";
    F.fColor.value = c ? (c.color || "") : "";
    F.fDate.value = c ? c.last : toISO(today());
    F.fDate.max = toISO(today());
    F.fWeeks.value = c ? c.weeks : 6;
    F.fPrice.value = c ? Number(c.price || 0).toFixed(2) : "";
    overlay.hidden = false;
    requestAnimationFrame(function () { overlay.classList.add("show"); });
    setTimeout(function () { F.fName.focus(); }, 60);
  }
  function closeSheet() {
    overlay.classList.remove("show");
    setTimeout(function () { overlay.hidden = true; }, 200);
    editingId = null;
    if (lastFocus && lastFocus.focus && document.body.contains(lastFocus)) { try { lastFocus.focus(); } catch (e) { /* nada */ } }
  }
  function fail(input, msg) {
    errBox.textContent = msg;
    input.setAttribute("aria-invalid", "true");
    input.focus();
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    clearInvalid();
    var name = F.fName.value.trim().replace(/\s+/g, " ");
    var phone = F.fPhone.value.trim();
    var phoneDigits = phone.replace(/\D/g, "");
    var date = F.fDate.value;
    var weeksRaw = F.fWeeks.value.trim();
    var weeks = Number(weeksRaw);
    var priceRaw = F.fPrice.value.trim();
    var price = Number(priceRaw);
    if (!name) return fail(F.fName, "Escribe el nombre de la clienta.");
    if (phone && (/[^\d\s+\-()]/.test(phone) || phoneDigits.length < 7 || phoneDigits.length > 15)) {
      return fail(F.fPhone, "Revisa el teléfono: escribe solo números, ej: 6123-4567.");
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(fromISO(date).getTime())) return fail(F.fDate, "Elige la fecha del último tinte.");
    if (date > toISO(today())) return fail(F.fDate, "La fecha del último tinte no puede ser en el futuro.");
    if (!weeksRaw || !(weeks >= 1 && weeks <= 52) || Math.floor(weeks) !== weeks) return fail(F.fWeeks, "Las semanas tienen que ser un número entero entre 1 y 52.");
    if (priceRaw === "" || isNaN(price)) return fail(F.fPrice, "Escribe el precio del retoque.");
    if (price < 0) return fail(F.fPrice, "El precio no puede ser negativo.");
    var data = {
      name: name,
      phone: phone,
      color: F.fColor.value.trim(),
      last: date,
      weeks: weeks,
      price: Math.round(price * 100) / 100
    };
    var wasEdit = !!editingId;
    if (editingId) {
      var c = find(editingId);
      if (c) Object.keys(data).forEach(function (k) { c[k] = data[k]; });
    } else {
      data.id = uid();
      state.clientas.push(data);
    }
    persist();
    closeSheet();
    render();
    toast(wasEdit ? "Cambios guardados" : name + " agregada");
  });
  document.getElementById("btnCancel").addEventListener("click", closeSheet);
  btnDelete.addEventListener("click", function () {
    var c = find(editingId);
    if (!c) return;
    if (!dosToques(this)) return;
    state.clientas = state.clientas.filter(function (x) { return x.id !== c.id; });
    persist();
    closeSheet();
    render();
    toast("Clienta eliminada");
  });
  overlay.addEventListener("click", function (ev) { if (ev.target === overlay) closeSheet(); });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !overlay.hidden) closeSheet();
  });

  // ---------- eventos de la lista ----------
  document.getElementById("list").addEventListener("click", function (ev) {
    var t = ev.target;
    if (t.closest("a.wa")) return; // deja que el enlace abra WhatsApp
    var came = t.closest("[data-came]");
    if (came) {
      var c = find(came.getAttribute("data-came"));
      if (c) {
        c.last = toISO(today());
        persist();
        render();
        toast("¡Listo! " + firstName(c.name) + " quedó al día");
      }
      return;
    }
    var card = t.closest(".card");
    if (card) {
      var cl = find(card.getAttribute("data-id"));
      if (cl) openSheet(cl);
    }
  });

  function setTab(next) {
    tab = next;
    document.getElementById("tabDue").setAttribute("aria-selected", String(next === "due"));
    document.getElementById("tabAll").setAttribute("aria-selected", String(next === "all"));
    render();
  }
  document.getElementById("tabDue").addEventListener("click", function () { setTab("due"); });
  document.getElementById("tabAll").addEventListener("click", function () { setTab("all"); });
  document.getElementById("fab").addEventListener("click", function () { openSheet(null); });

  document.getElementById("btnClearDemo").addEventListener("click", function () {
    state.clientas = state.clientas.filter(function (c) { return !c.ejemplo; });
    persist();
    render();
    toast("Listo, ya puedes agregar tus clientas");
  });

  // ---------- dónde se guarda ----------
  function showMode(m) {
    var el = document.getElementById("saved");
    el.textContent = m === "nube" ? "Se guarda en la nube" : "Se guarda en este equipo";
    el.classList.toggle("nube", m === "nube");
  }
  Store.onMode = showMode;
  Store.onError = function (msg) { toast(msg); };

  // ---------- inicio ----------
  Store.init("retoques", function (st) {
    if (st && Array.isArray(st.clientas)) {
      state = { v: 1, clientas: st.clientas.filter(function (c) { return c && c.id && c.name; }) };
    } else {
      state = { v: 1, clientas: seed() }; // datos de ejemplo (no se guardan hasta que haya un cambio)
    }
    if (editingId && !find(editingId)) closeSheet();
    render();
    showMode(Store.mode());
  });
})();
</script>
</body>
</html>
