<!DOCTYPE html>
<html lang="es">
<head>
<script>
/* Fuera de Claude: guarda en este navegador y descarga archivos normal. */
(function(){ if (window.claude) return;
  window.claude = { use: function(n){ return Promise.resolve(n !== 'downloads' ? null : { save: function(o){
    try { var b = o.data instanceof Blob ? o.data : new Blob([o.data]); var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = o.filename; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      return Promise.resolve({status:'saved'}); } catch(e){ return Promise.reject({code:'unavailable', message:String(e)}); } } }); } };
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Inventario y Ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7;--card:#fff;--line:#e6e8ee;--tx:#1b1f2a;--mut:#6b7280;
  --pri:#1f5ae6;--pri-d:#1747b8;--pri-s:#e8effd;
  --red:#d32f3a;--red-s:#fde8ea;--grn:#1e8e4e;--grn-s:#e3f5e9;
  --org:#e8890c;--org-s:#fdf0e1;--pur:#5b4bd6;--pur-s:#ecebfd;--yel-s:#fdf6c3;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#e9ecf1;color:var(--tx);font-family:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
.top{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;gap:8px;padding:10px 8px;min-height:60px;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;font-weight:500;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font-size:12px;color:var(--mut);font-weight:400}
.ib{width:42px;height:42px;border:0;background:transparent;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ib:hover{background:#f0f2f6}
svg.i{width:22px;height:22px;fill:currentColor;flex:0 0 auto}
main{padding:12px 14px 110px}
.banner{display:flex;align-items:center;gap:8px;background:var(--yel-s);color:#6b5b00;border-radius:10px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.banner .dot{width:8px;height:8px;border-radius:50%;background:#c9a200;flex:0 0 auto}
.sec{font-size:14px;color:#4b5263;font-weight:500;margin:14px 2px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:92px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.tile:hover{border-color:#cfd5e1}
.tile b{font-weight:500;font-size:15px}
.ic{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.ic svg.i{width:20px;height:20px}
.c-blue{background:var(--pri-s);color:var(--pri)}.c-grn{background:var(--grn-s);color:var(--grn)}
.c-org{background:var(--org-s);color:var(--org)}.c-pur{background:var(--pur-s);color:var(--pur)}
.c-red{background:var(--red-s);color:var(--red)}.c-gry{background:#eef0f4;color:#4b5263}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
button.row:hover{border-color:#cfd5e1}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:0 0 auto}
.chev{color:#9aa1ae}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:500;display:flex;align-items:center;gap:10px}
.card h3 .ic{width:30px;height:30px;border-radius:8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.kv span:first-child{color:var(--mut)}
.kv.big{font-weight:700;font-size:15px;border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--grn-s);color:var(--grn)}.b-par{background:var(--pri-s);color:var(--pri)}.b-pen{background:var(--org-s);color:#b26500}
.neg{color:var(--red);font-weight:700}.pos{color:var(--grn);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:28px 10px;font-size:14px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:500;background:var(--pri);color:#fff;width:100%;font-size:15px}
.btn:hover{background:var(--pri-d)}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid #c9d6f6}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f3c1c6}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;margin-top:12px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12.5px;color:#4b5263;margin:0 0 5px 2px}
.in{width:100%;border:1px solid #d5dae3;border-radius:10px;padding:12px;background:#fff;min-width:0}
.in:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px rgba(31,90,230,.15)}
textarea.in{resize:vertical;min-height:64px}
.money{position:relative}.money .cur{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:14px;pointer-events:none}
.money .in{padding-left:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #d5dae3;background:#fff;border-radius:10px;padding:8px 12px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--yel-s);border-color:#e9d769;font-weight:500}
.chip.on-blue{background:var(--pri-s);border-color:#b8cbf6;color:var(--pri);font-weight:500}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.mnav{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:12px}
.mnav .mid{text-align:center}
.mnav .mid b{display:block;font-size:16.5px;font-weight:500;margin-bottom:4px}
.pill-red{display:inline-block;background:var(--red-s);color:var(--red);font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{border-radius:12px;padding:12px;background:var(--pri-s);color:var(--pri);min-width:0}
.st.red{background:var(--red-s);color:var(--red)}
.st.grn{background:var(--grn-s);color:var(--grn)}
.st.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.st svg.i{width:20px;height:20px}
.st .v{font-size:17px;font-weight:700;margin-top:4px;overflow-wrap:anywhere}
.st .l{font-size:12px;opacity:.9;margin-top:2px}
.bar{height:6px;border-radius:4px;background:#fbf2c4;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:4px}
.bar.blue{background:#e6ebf5}.bar.blue i{background:var(--pri)}
.brow{display:flex;align-items:center;gap:10px;padding:8px 0}
.brow .grow{flex:1;min-width:0}
.ftab{width:100%;border-collapse:collapse;font-size:13px}
.ftab th{font-weight:500;color:var(--mut);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
.ftab th:first-child,.ftab td:first-child{text-align:left}
.ftab td{text-align:right;padding:7px 4px;border-bottom:1px solid #f0f1f5;white-space:nowrap}
.est3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.est3 div{border-radius:12px;padding:12px 6px;text-align:center}
.est3 b{display:block;font-size:20px}
.est3 span{font-size:12px}
.range{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12.5px;margin:6px 2px 12px}
.range svg.i{width:16px;height:16px}
.step{display:inline-flex;align-items:center;border:1px solid #d5dae3;border-radius:10px;overflow:hidden;flex:0 0 auto}
.step button{width:34px;height:34px;border:0;background:#f6f7fa;font-size:18px;line-height:1}
.step span{min-width:34px;text-align:center;font-weight:500}
.addb{border:1px solid #c9d6f6;background:var(--pri-s);color:var(--pri);border-radius:10px;padding:7px 12px;font-weight:500;font-size:13px;flex:0 0 auto}
.addb:disabled{opacity:.45;cursor:not-allowed}
.totbox{background:#f4f6fb;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.imgpick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed #c8cfdc;border-radius:14px;padding:16px;color:#4b5263;font-size:13px;cursor:pointer;margin-bottom:12px;text-align:center}
.imgpick:focus-within{outline:2px solid var(--pri);outline-offset:2px}
.imgpick img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.imgpick input{position:absolute;opacity:0;width:1px;height:1px}
.linkbtn{background:none;border:0;color:var(--red);font-size:13px;padding:4px}
/* overlays */
.ovl{position:fixed;inset:0;background:rgba(15,20,30,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.ovl.show{opacity:1;pointer-events:auto}
.layer{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
.layer .col{position:relative;width:100%;max-width:460px;height:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;padding:8px 16px 20px;transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;pointer-events:auto;box-shadow:0 -6px 24px rgba(0,0,0,.12)}
.sheet.show{transform:none;visibility:visible;transition:transform .22s ease}
.grab{width:40px;height:4px;border-radius:3px;background:#c9ced8;margin:4px auto 12px}
.sheet h2{font-size:19px;font-weight:500;margin:0 0 14px}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(300px,86%);background:#fff;transform:translateX(-105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;pointer-events:auto;overflow-y:auto}
.drawer.show{transform:none;visibility:visible;transition:transform .22s ease}
.dhead{background:var(--pri);color:#fff;padding:22px 18px 18px}
.dhead .av{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:12px}
.dhead b{display:block;font-size:17px;font-weight:500}
.dhead small{opacity:.85}
.dsec{font-size:11.5px;letter-spacing:.06em;color:var(--mut);font-weight:500;padding:14px 18px 4px}
.ditem{display:flex;align-items:center;gap:14px;width:calc(100% - 16px);margin:1px 8px;padding:11px 12px;border:0;background:none;border-radius:10px;text-align:left;font-size:14.5px;color:#2a2f3b}
.ditem:hover{background:#f2f4f8}
.ditem.on{background:var(--pri-s);color:var(--pri);font-weight:500}
.ditem svg.i{width:20px;height:20px;color:#5b6270}
.ditem.on svg.i{color:var(--pri)}
.fabcol{position:relative;width:100%;max-width:460px;height:100%}
.fab{position:absolute;right:16px;bottom:18px;display:inline-flex;align-items:center;gap:8px;background:var(--pri);color:#fff;border:0;border-radius:16px;padding:15px 20px;font-weight:500;pointer-events:auto;box-shadow:0 6px 16px rgba(31,90,230,.35)}
.fab:hover{background:var(--pri-d)}
.fab.hide{display:none}
.toast{position:absolute;left:16px;right:16px;bottom:86px;background:#222833;color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.res{max-height:240px;overflow-y:auto;margin:-4px 0 12px}
.res .row{padding:9px 10px}
.hint{font-size:12.5px;color:var(--mut);margin:-6px 2px 12px}

.ctxbar{position:sticky;top:60px;z-index:19;display:flex;align-items:center;gap:6px;padding:7px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut);min-width:0}
.ctxbar svg.i{width:18px;height:18px;color:var(--pri)}
.ctxbar select{border:1px solid #d5dae3;border-radius:8px;padding:5px 8px;background:#fff;min-width:0;max-width:55%;font-size:13px}
.ctxbar b{color:var(--tx);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctxbar .save{margin-left:auto;font-size:11.5px;white-space:nowrap;color:var(--mut)}
.login{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto}
.login[hidden]{display:none}
.login .lcol{max-width:460px;margin:0 auto;padding:30px 16px 40px}
.lhead{text-align:center;margin-bottom:18px}
.lhead .logo{width:64px;height:64px;border-radius:16px;margin:0 auto 10px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;overflow:hidden}
.lhead .logo img{width:100%;height:100%;object-fit:cover}
.lhead h2{margin:0;font-size:22px;font-weight:500}
.lhead p{margin:6px 0 0;color:var(--mut);font-size:15px}
.pindots{display:flex;justify-content:center;gap:16px;margin:18px 0 8px}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid #9aa1ae}
.pindots i.on{background:var(--pri);border-color:var(--pri)}
.pinmsg{text-align:center;min-height:20px;color:var(--red);font-size:13.5px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:8px auto 0}
.keypad button{height:58px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:500;display:flex;align-items:center;justify-content:center}
.keypad button:hover{border-color:#cfd5e1}
.keypad .k-alt{font-size:14px;color:var(--mut)}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.av2{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:0 0 auto}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 14px;cursor:pointer}
.switch input{width:46px;height:26px;appearance:none;-webkit-appearance:none;background:#cfd5e1;border-radius:999px;position:relative;cursor:pointer;flex:0 0 auto;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--pri)}
.switch input:checked::after{left:23px}
.b-anu{background:#eef0f4;color:#4b5263}
.exp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.exp .btn{width:auto;flex:1 1 90px;padding:10px 12px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.exp .btn svg.i{width:18px;height:18px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.step input{width:46px;height:34px;border:0;text-align:center;font-weight:500;padding:0;background:#fff;-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step button:disabled{opacity:.4;cursor:not-allowed}
.banner.red{background:var(--red-s);color:var(--red)}
.banner.red .dot{background:var(--red)}
.banner .chip{padding:5px 10px;font-size:12.5px;margin-left:auto}
.lbl2{font-size:12px;color:var(--mut);margin:10px 2px 6px}
.dhead .logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:12px;overflow:hidden}
.dhead .logo img{width:100%;height:100%;object-fit:cover}
.dhead .chip{margin-top:12px;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff;display:inline-flex;align-items:center;gap:6px}
.dhead .chip svg.i{width:16px;height:16px}
.notice{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;background:#eef0f4;color:#4b5263}
@media (min-width:900px){
  .app,.layer .col,.fabcol{max-width:760px}
  .grid2.q4{grid-template-columns:repeat(4,1fr)}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stats .st.wide{grid-column:span 2}
}

<body>
<div class="app" id="app">
  <header class="top">
    <button class="ib" id="navBtn" type="button" aria-label="Menú"></button>
    <h1 id="title">Inicio</h1>
    <div id="topAct"></div>
  </header>
  <div class="ctxbar" id="ctxbar"></div>
  <main id="main"></main>
</div>

<div class="login" id="login" hidden><div class="lcol" id="loginCol"></div></div>

<div class="ovl" id="ovl"></div>
<div class="layer" aria-hidden="true" id="drawerLayer"><div class="col"><nav class="drawer" id="drawer" aria-label="Menú principal"></nav></div></div>
<div class="layer" id="sheetLayer"><div class="col"><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section></div></div>
<div class="layer" style="z-index:30"><div class="fabcol">
  <button class="fab hide" id="fab" type="button"></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div></div>

<script>
/* Store: guarda el estado de la app.
   - En Claude (artifact con capacidades db+user): en la nube, privado por usuario.
   - Fuera de Claude o sin sesión: en localStorage (si existe).
   Uso:
     Store.init('mi-app', function(state, origen){ ...render... });  // puede llamarse 2 veces: local y luego nube
     Store.save(state);   // con pausa de 600 ms; una escritura a la vez
     Store.mode()         // 'local' | 'nube'
*/
var Store = (function () {
  var key = null, ref = null, mode = 'local', timer = null, chain = Promise.resolve(), last = null, onLoadCb = null, dirty = false;
  function lsGet() { try { var s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function lsSet(v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function connect() {
    return new Promise(function (resolve) {
      if (!window.claude || typeof window.claude.use !== 'function') return resolve(false);
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; resolve(false); } }, 10000);
      Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
        var d = r[0], u = r[1];
        if (!d || !u) { done = true; clearTimeout(t); return resolve(false); }
        return u.id().then(function (id) {
          if (done) return;
          done = true; clearTimeout(t);
          if (!id) return resolve(false);
          ref = d.doc('data/users/' + id + '/' + key);
          resolve(true);
        });
      }).catch(function () { if (!done) { done = true; clearTimeout(t); resolve(false); } });
    });
  }
  function init(k, onLoad) {
    key = k; onLoadCb = onLoad;
    onLoad(lsGet(), 'local');
    connect().then(function (ok) {
      if (!ok) return;
      return ref.get().then(function (snap) {
        mode = 'nube';
        if (snap.exists) {
          var d = snap.data();
          if (d && typeof d.state === 'string' && !dirty) {
            try { var st = JSON.parse(d.state); lsSet(st); onLoadCb(st, 'nube'); } catch (e) {}
          }
        } else if (last) { write(last); }
        if (typeof Store.onMode === 'function') Store.onMode(mode);
      }).catch(function () { ref = null; mode = 'local'; });
    });
  }
  function write(state) {
    var body = { state: JSON.stringify(state), updatedAt: new Date().toISOString() };
    chain = chain.then(function () {
      if (!ref) return;

function normalize(s){
  const d=s&&typeof s==="object"?s:{};
  const A=k=>Array.isArray(d[k])?d[k]:[];
  const o={v:1,ejemplo:!!d.ejemplo,negocio:Object.assign({nombre:"Mi negocio",moneda:"B/.",logo:null,sinStock:false},d.negocio&&typeof d.negocio==="object"?d.negocio:{}),
    sucursales:A("sucursales"),usuarios:A("usuarios"),categorias:A("categorias"),proveedores:A("proveedores"),clientes:A("clientes"),
    productos:A("productos"),ventas:A("ventas"),gastos:A("gastos"),mermas:A("mermas"),seq:+d.seq||0};
  if(!o.sucursales.length)o.sucursales.push({id:uid(),nombre:"Sucursal principal",notas:""});
  o.productos.forEach(p=>{if(!p.stock||typeof p.stock!=="object")p.stock={};});
  o.ventas.forEach(v=>{if(!Array.isArray(v.pagos))v.pagos=[];if(!Array.isArray(v.items))v.items=[];});
  o.seq=Math.max(o.seq,o.ventas.reduce((a,v)=>Math.max(a,+v.num||0),0));
  return o;
}

function pinDots(){const d=$("#pinDots");if(d)d.innerHTML=[0,1,2,3].map(i=>'<i class="'+(i<lg.pin.length?"on":"")+'"></i>').join("");}
function pinKey(k){
  if(!lg.u)return;
  if(k==="del"){lg.pin=lg.pin.slice(0,-1);pinDots();return;}
  if(lg.pin.length>=4)return;
  lg.pin+=k;pinDots();$("#pinMsg").textContent="";
  if(lg.pin.length===4){
    if(lg.pin===String(lg.u.pin)){const u=lg.u;lg={u:null,pin:""};login(u);}
    else{const d=$("#pinDots");$("#pinMsg").textContent="PIN incorrecto. Prueba otra vez.";d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");lg.pin="";setTimeout(pinDots,250);}
  }
}
document.addEventListener("keydown",e=>{
  if(loginVisible()){
    if(!lg.u)return;
    if(/^[0-9]$/.test(e.key)){pinKey(e.key);e.preventDefault();}
    else if(e.key==="Backspace"){pinKey("del");e.preventDefault();}
    else if(e.key==="Escape"){lg.u=null;lg.pin="";drawLogin();}
    return;
  }
  if(e.key==="Escape"){closeSheet();closeDrawer();}
});

/* Nueva venta */
function startVenta(){ctx.nv={cli:"",items:{},tipo:"total",monto:"",forma:"Efectivo",q:""};go("nueva");}
const nvTotal=()=>sum(Object.entries(ctx.nv.items),e=>{const p=byId(db.productos,e[0]);return p?p.precio*e[1]:0;});
const libre=()=>!!db.negocio.sinStock;
VIEWS.nueva=()=>{
  const n=ctx.nv;if(!n){startVenta();return "";}
  return '<div class="card"><div class="kv" style="padding-top:0"><span>Sucursal</span><b>'+esc(sucName(sucAct))+'</b></div><div class="kv" style="margin-bottom:8px"><span>Vendedor</span><b>'+esc(me.nombre)+'</b></div>'+
  '<label class="fld" style="margin-bottom:0"><span>Cliente (opcional)</span><select class="in" id="nvCli"><option value="">Sin cliente</option>'+db.clientes.map(c=>'<option value="'+esc(c.id)+'"'+(n.cli===c.id?" selected":"")+'>'+esc(c.nombre)+'</option>').join("")+'</select></label></div>'+
  '<div class="card"><h3><span class="ic c-org">'+ic("box")+'</span>Agregar productos</h3><label class="fld"><span class="sr">Buscar producto</span><input class="in" id="nvQ" type="search" placeholder="Buscar producto…" value="'+esc(n.q)+'"></label><div class="res list" id="nvRes"></div></div>'+
  '<div class="card" id="nvCart"></div>'+
  '<div class="card" id="nvPay"></div>'+
  '<button type="button" class="btn" id="nvSave">Registrar venta</button>';
};
function nvRes(){
  const n=ctx.nv,q=n.q.trim().toLowerCase();
  const ps=db.productos.filter(p=>!q||p.nombre.toLowerCase().includes(q)||(p.desc||"").toLowerCase().includes(q));
  $("#nvRes").innerHTML=ps.length?ps.map(p=>{const inC=n.items[p.id]||0;const st=stockOf(p,sucAct);const rest=st-inC;
    return '<div class="row">'+(p.img?'<img class="thumb" src="'+p.img+'" alt="">':'<span class="thumb '+colorFor(p.nombre)+'">'+esc(p.nombre.charAt(0))+'</span>')+'<span class="grow"><span class="t" style="display:block">'+esc(p.nombre)+'</span><span class="s" style="display:block">'+m(p.precio)+' · <span style="color:'+(rest<=5?"var(--red)":"inherit")+'">stock '+rest+'</span></span></span><button type="button" class="addb" data-add="'+esc(p.id)+'"'+(rest<=0&&!libre()?" disabled":"")+'>+ Agregar</button></div>';}).join(""):'<div class="empty">Sin resultados</div>';
  document.querySelectorAll("#nvRes [data-add]").forEach(b=>b.onclick=()=>{n.items[b.dataset.add]=(n.items[b.dataset.add]||0)+1;nvRes();nvCart();});
}
function nvCart(){
  const n=ctx.nv,ent=Object.entries(n.items).filter(e=>e[1]>0&&byId(db.productos,e[0]));
  $("#nvCart").innerHTML='<h3><span class="ic c-blue">'+ic("cart")+'</span>Carrito</h3>'+(ent.length?ent.map(e=>{const p=byId(db.productos,e[0]);const st=stockOf(p,sucAct);
    return '<div class="brow"><span class="grow"><span class="t" style="display:block;font-weight:500">'+esc(p.nombre)+'</span><small style="color:var(--mut)">'+m(p.precio)+' × '+e[1]+' = <b style="color:var(--tx)">'+m(p.precio*e[1])+'</b></small></span><span class="step"><button type="button" data-dec="'+esc(p.id)+'" aria-label="Quitar uno">−</button><input type="number" min="0" step="1" inputmode="numeric" data-qty="'+esc(p.id)+'" value="'+e[1]+'" aria-label="Cantidad de '+esc(p.nombre)+'"><button type="button" data-inc="'+esc(p.id)+'" aria-label="Agregar uno"'+(e[1]>=st&&!libre()?" disabled":"")+'>+</button></span></div>';}).join(""):'<div style="color:var(--mut);font-size:14px">Agrega productos desde la lista.</div>')+
  '<div class="kv big"><span style="color:var(--tx)">Total</span><span id="nvTot">'+m(nvTotal())+'</span></div>';
  const redo=()=>{nvRes();nvCart();};
  document.querySelectorAll("#nvCart [data-dec]").forEach(b=>b.onclick=()=>{const id=b.dataset.dec;n.items[id]--;if(n.items[id]<=0)delete n.items[id];redo();});
  document.querySelectorAll("#nvCart [data-inc]").forEach(b=>b.onclick=()=>{n.items[b.dataset.inc]++;redo();});
  document.querySelectorAll("#nvCart [data-qty]").forEach(inp=>inp.onchange=()=>{
    const id=inp.dataset.qty,p=byId(db.productos,id);let q=parseInt(inp.value,10);if(!(q>0)){delete n.items[id];redo();return;}
    const st=stockOf(p,sucAct);if(!libre()&&q>st){q=Math.max(0,st);toast("Solo hay "+st+" en stock");}
    if(q>0)n.items[id]=q;else delete n.items[id];redo();});
  nvPay();
}
function nvPay(){
  const n=ctx.nv;const el=$("#nvPay");if(!el)return;
  el.innerHTML='<h3><span class="ic c-grn">'+ic("wallet")+'</span>Pago</h3><div class="two" style="margin-bottom:12px"><button type="button" class="chip'+(n.tipo==="total"?" on-blue":"")+'" data-t="total">Pago total</button><button type="button" class="chip'+(n.tipo==="parcial"?" on-blue":"")+'" data-t="parcial">Pago parcial</button></div>'+
  (n.tipo==="parcial"?'<label class="fld"><span>Monto pagado ahora (0 = queda pendiente)</span><div class="money"><span class="cur">'+esc(db.negocio.moneda)+'</span><input class="in" id="nvMonto" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="'+esc(n.monto)+'"></div></label>':'<p class="hint" style="margin:0 2px 12px">Se cobra el total: <b>'+m(nvTotal())+'</b></p>')+
  '<div class="fld" style="margin-bottom:0"><span>Forma de pago</span><div class="chips">'+FORMAS.map(f=>'<button type="button" class="chip'+(n.forma===f[0]?" on":"")+'" data-fp="'+f[0]+'">'+f[1]+' '+f[0]+'</button>').join("")+'</div></div>';
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{n.tipo=b.dataset.t;nvPay();});
  el.querySelectorAll("[data-fp]").forEach(b=>b.onclick=()=>{n.forma=b.dataset.fp;nvPay();});
  const mi=el.querySelector("#nvMonto");if(mi)mi.oninput=()=>{n.monto=mi.value;};
}
AFTER.nueva=()=>{
  const n=ctx.nv;if(!n)return;
  $("#nvCli").onchange=e=>n.cli=e.target.value;
  $("#nvQ").oninput=e=>{n.q=e.target.value;nvRes();};
  nvRes();nvCart();
  $("#nvSave").onclick=()=>{
    const ent=Object.entries(n.items).filter(e=>e[1]>0);
    if(!ent.length){toast("Agrega al menos un producto");return;}
    for(const e of ent){const p=byId(db.productos,e[0]);if(!p){toast("Un producto ya no existe");return;}if(!libre()&&stockOf(p,sucAct)<e[1]){toast("Stock insuficiente: "+p.nombre);return;}}
    const items=ent.map(e=>{const p=byId(db.productos,e[0]);return {prodId:p.id,nombre:p.nombre,cant:e[1],precio:p.precio,costo:p.costo};});
    const total=sum(items,i=>i.cant*i.precio);
    let paid=total;
    if(n.tipo==="parcial"){paid=String(n.monto).trim()===""?0:toC(n.monto);if(!(paid>=0)||paid>=total){toast("En pago parcial el monto debe ser menor al total");return;}}
    items.forEach(i=>{const p=byId(db.productos,i.prodId);p.stock[sucAct]=stockOf(p,sucAct)-i.cant;});
    db.seq=(db.seq||0)+1;
    const cl=byId(db.clientes,n.cli);
    const v={id:uid(),num:db.seq,fecha:today(),sucId:sucAct,vendedorId:me.id,vendedorNombre:me.nombre,clienteId:n.cli||"",clienteNombre:cl?cl.nombre:"",items:items,total:total,
      pagos:paid>0?[{id:uid(),monto:paid,forma:n.forma,fecha:today(),userId:me.id}]:[],anulada:false};
    db.ventas.push(v);save();ctx.nv=null;
    ctx.ventaId=v.id;stack.pop();stack.push("detalle");render(true);
    toast("Venta registrada · "+estado(v));
  };
};

/* Productos */
const prodMatch=(p,q)=>!q||p.nombre.toLowerCase().includes(q)||(p.desc||"").toLowerCase().includes(q);
VIEWS.productos=()=>{
  const q=ctx.q.toLowerCase();

  (low?'<div class="banner red"><span class="dot"></span>'+low+' producto'+(low===1?'':'s')+' con stock bajo (5 o menos) en '+esc(sucName(sucAct))+'</div>':'')+
  '<label class="fld"><input class="in" id="pq" type="search" placeholder="Buscar producto…" aria-label="Buscar producto" value="'+esc(ctx.q)+'"></label><div class="list" id="plist">'+prodList(db.productos.filter(p=>prodMatch(p,q)))+'</div>';

function prodList(ps){
  if(!ps.length)return '<div class="empty">Sin productos.</div>';
  return ps.map(p=>{const c=byId(db.categorias,p.catId);const st=stockOf(p,sucAct);const lowS=st<=5;
    return '<button type="button" class="row" data-p="'+esc(p.id)+'">'+(p.img?'<img class="thumb" src="'+p.img+'" alt="">':'<span class="thumb '+colorFor(p.nombre)+'">'+esc(p.nombre.charAt(0))+'</span>')+'<span class="grow"><span class="t" style="display:block">'+esc(p.nombre)+'</span><span class="s" style="display:block">'+esc(c?c.nombre:"Sin categoría")+' · costo '+m(p.costo)+'</span></span><span class="r"><b style="display:block">'+m(p.precio)+'</b><span class="s" style="color:'+(lowS?"var(--red)":"var(--mut)")+';font-weight:'+(lowS?"500":"400")+'">'+(lowS?"Stock bajo: ":"Stock: ")+st+'</span></span></button>';}).join("");
}
AFTER.productos=()=>{
  $("#newProd").onclick=()=>prodForm(null);
  const bind=()=>document.querySelectorAll("#plist [data-p]").forEach(b=>b.onclick=()=>prodForm(byId(db.productos,b.dataset.p)));
  $("#pq").oninput=e=>{ctx.q=e.target.value;const q=ctx.q.toLowerCase();$("#plist").innerHTML=prodList(db.productos.filter(p=>prodMatch(p,q)));bind();};
  bind();
};
function prodForm(p){

  '<div class="two"><label class="fld"><span>Precio de costo</span><div class="money"><span class="cur">'+cur+'</span><input class="in" id="pCos" type="number" inputmode="decimal" step="0.01" min="0" value="'+(p?cs(p.costo):"")+'"></div></label>'+
  '<label class="fld"><span>Precio de venta *</span><div class="money"><span class="cur">'+cur+'</span><input class="in" id="pPre" type="number" inputmode="decimal" step="0.01" min="0" value="'+(p?cs(p.precio):"")+'"></div></label></div>'+
  '<div class="fld"><span>'+(p?"Stock por sucursal":"Stock inicial por sucursal")+'</span><div class="two">'+db.sucursales.map(s=>'<label class="fld" style="margin:0"><span style="font-size:12px;color:var(--mut)">'+esc(s.nombre)+'</span><input class="in" data-stk="'+esc(s.id)+'" type="number" inputmode="numeric" step="1" value="'+(p?stockOf(p,s.id):"")+'" placeholder="0"></label>').join("")+'</div></div>'+

  });
}

/* CRUD simple: clientes, proveedores, categorías */
const ENT={
  clientes:{s:"cliente",icon:"people",c:"c-grn",f:[["nombre","Nombre *"],["tel","Teléfono"],["notas","Notas"]]},
  proveedores:{s:"proveedor",icon:"truck",c:"c-org",f:[["nombre","Nombre *"],["tel","Teléfono"],["notas","Notas"]]},
  categorias:{s:"categoría",icon:"cat",c:"c-pur",f:[["nombre","Nombre *"],["notas","Descripción"]],fem:true}
};
function crudView(k){
  const e=ENT[k],arr=db[k];
  const sub=x=>k==="categorias"?(db.productos.filter(p=>p.catId===x.id).length+" productos"+(x.notas?" · "+esc(x.notas):"")):
    k==="proveedores"?[x.tel,x.notas].filter(Boolean).map(esc).concat([db.productos.filter(p=>p.provId===x.id).length+" productos"]).join(" · "):[x.tel,x.notas].filter(Boolean).map(esc).join(" · ");
  return '<button type="button" class="btn" id="crudNew" style="margin-bottom:12px">+ '+(e.fem?"Nueva ":"Nuevo ")+e.s+'</button><div class="list">'+(arr.length?arr.map(x=>'<button type="button" class="row" data-id="'+esc(x.id)+'"><span class="ic '+e.c+'">'+ic(e.icon)+'</span><span class="grow"><span class="t" style="display:block">'+esc(x.nombre)+'</span><span class="s" style="display:block">'+(sub(x)||"&nbsp;")+'</span></span>'+ic("chev","chev")+'</button>').join(""):'<div class="empty">Sin registros.</div>')+'</div>';
}
function crudBind(k){
  $("#crudNew").onclick=()=>crudForm(k,null);
  document.querySelectorAll("#main [data-id]").forEach(b=>b.onclick=()=>crudForm(k,byId(db[k],b.dataset.id)));
}
function crudForm(k,x){
  const e=ENT[k];
  openSheet('<h2 id="sheetTitle">'+(x?"Editar ":(e.fem?"Nueva ":"Nuevo "))+e.s+'</h2><form id="cfForm">'+e.f.map(f=>'<label class="fld"><span>'+f[1]+'</span>'+(f[0]==="notas"?'<textarea class="in" id="cf_'+f[0]+'">'+esc(x?x[f[0]]:"")+'</textarea>':'<input class="in" id="cf_'+f[0]+'"'+(f[0]==="tel"?' type="tel" inputmode="tel"':'')+' value="'+esc(x?x[f[0]]:"")+'">')+'</label>').join("")+
  '<button type="submit" class="btn">Guardar</button></form>'+(x?'<div class="btn-row"><button type="button" class="btn danger" id="cfDel">Eliminar</button></div>':''),
  sh=>{
    sh.querySelector("#cfForm").onsubmit=ev=>{
      ev.preventDefault();
      const o={};e.f.forEach(f=>o[f[0]]=$("#cf_"+f[0]).value.trim());
      if(!o.nombre){toast("El nombre es obligatorio");return;}
      if(x)Object.assign(x,o);else db[k].push(Object.assign({id:uid()},o));
      save();closeSheet();render();toast("Guardado");
    };
    const d=sh.querySelector("#cfDel");if(d)d.onclick=()=>{if(!dosToques(d))return;db[k]=db[k].filter(y=>y!==x);
      if(k==="categorias")db.productos.forEach(p=>{if(p.catId===x.id)p.catId="";});
      if(k==="proveedores")db.productos.forEach(p=>{if(p.provId===x.id)p.provId="";});
      if(k==="clientes")db.ventas.forEach(v=>{if(v.clienteId===x.id&&!v.clienteNombre)v.clienteNombre=x.nombre;});
      save();closeSheet();render();toast("Eliminado");};
  });
}
["clientes","proveedores","categorias"].forEach(k=>{VIEWS[k]=()=>crudView(k);AFTER[k]=()=>crudBind(k);});

/* Reportes */
function repRange(){
  const t=new Date(),T=iso(t);
  if(ctx.rep==="hoy")return [T,T];
  if(ctx.rep==="semana"){const d=new Date(t);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return [iso(d),T];}
  if(ctx.rep==="mes")return [iso(new Date(t.getFullYear(),t.getMonth(),1)),T];
  if(!ctx.rFrom){ctx.rFrom=iso(new Date(t.getFullYear(),t.getMonth(),1));ctx.rTo=T;}
  return ctx.rFrom<=ctx.rTo?[ctx.rFrom,ctx.rTo]:[ctx.rTo,ctx.rFrom];
}
function repData(){
  if(ctx.rSuc!=="all"&&!byId(db.sucursales,ctx.rSuc))ctx.rSuc="all";
  const [a,b]=repRange();const inR=d=>d>=a&&d<=b;
  const sOk=x=>ctx.rSuc==="all"||x.sucId===ctx.rSuc;
  const vAll=db.ventas.filter(v=>!v.anulada&&sOk(v));
  const vs=vAll.filter(v=>inR(v.fecha));
  const pagos=[];vAll.forEach(v=>v.pagos.forEach(p=>{if(inR(p.fecha))pagos.push(p);}));
  const gs=db.gastos.filter(g=>sOk(g)&&inR(g.fecha)),ms=db.mermas.filter(x=>sOk(x)&&inR(x.fecha));
  const cob=sum(pagos,p=>p.monto),gas=sum(gs,g=>g.monto),mer=sum(ms,x=>x.costo*x.cant),neto=cob-gas-mer;
  const st=p=>ctx.rSuc==="all"?db.sucursales.reduce((s,x)=>s+Math.max(0,stockOf(p,x.id)),0):Math.max(0,stockOf(p,ctx.rSuc));
  const cap=sum(db.productos,p=>p.costo*st(p)),val=sum(db.productos,p=>p.precio*st(p));
  const byT={};gs.forEach(g=>byT[g.tipo]=(byT[g.tipo]||0)+g.monto);
  const tl=Object.entries(byT).sort((x,y)=>y[1]-x[1]);
  const pr={};vs.forEach(v=>v.items.forEach(i=>{const o=pr[i.prodId]||(pr[i.prodId]={n:i.nombre,u:0,ing:0,gan:0});o.u+=i.cant;o.ing+=i.cant*i.precio;o.gan+=i.cant*(i.precio-i.costo);}));
  const pl=Object.values(pr).sort((x,y)=>y.gan-x.gan);
  const fl={};pagos.forEach(p=>{(fl[p.fecha]=fl[p.fecha]||{i:0,o:0}).i+=p.monto;});gs.forEach(g=>{(fl[g.fecha]=fl[g.fecha]||{i:0,o:0}).o+=g.monto;});
  const fk=Object.keys(fl).sort();
  const ec={Pagada:0,Parcial:0,Pendiente:0};vs.forEach(v=>ec[estado(v)]++);
  const pvm={};vs.forEach(v=>{const o=pvm[v.vendedorId]||(pvm[v.vendedorId]={n:venName(v),c:0,t:0});o.c++;o.t+=v.total;});
  const pv=Object.values(pvm).sort((x,y)=>y.t-x.t);
  const cxc=vAll.filter(v=>saldo(v)>0).sort((x,y)=>x.fecha.localeCompare(y.fecha)||x.num-y.num);
  return {a:a,b:b,cob:cob,gas:gas,mer:mer,neto:neto,cap:cap,val:val,tl:tl,pl:pl,fl:fl,fk:fk,ec:ec,pv:pv,cxc:cxc,suc:ctx.rSuc==="all"?"Todas":sucName(ctx.rSuc)};
}

  '<div class="exp">'+(dl?'<button type="button" class="btn ghost" id="xXls">'+ic("down")+'Excel</button><button type="button" class="btn ghost" id="xPdf">'+ic("down")+'PDF</button>':'')+'<button type="button" class="btn ghost" id="xCopy">'+ic("copy")+'Copiar</button></div>'+
  '<div class="card"><h3><span class="ic c-blue">'+ic("up")+'</span>Resumen financiero</h3><div class="stats">'+
    '<div class="st">'+ic("up")+'<div class="v">'+m(R.cob)+'</div><div class="l">Cobrado</div></div>'+
    '<div class="st red">'+ic("wallet")+'<div class="v">'+m(R.gas)+'</div><div class="l">Gastos</div></div>'+
    '<div class="st red">'+ic("warn")+'<div class="v">'+m(R.mer)+'</div><div class="l">Mermas</div></div>'+
    '<div class="st'+(R.neto<0?" red":" grn")+'">'+ic("up")+'<div class="v">'+m(R.neto)+'</div><div class="l">Resultado neto</div></div></div>'+

/* tablas para exportar: montos en centavos, columnas de dinero en "money" */
function repTables(){
  const R=repData();
  return {R:R,T:[
    {t:"Resumen",h:["Concepto","Monto"],money:[1],r:[["Cobrado",R.cob],["Gastos",R.gas],["Mermas",R.mer],["Resultado neto",R.neto],["Capital en inventario (costo total)",R.cap],["Valor de venta del inventario",R.val],["Ganancia potencial (si vendes todo)",R.val-R.cap]]},
    {t:"Gastos por categoría",h:["Tipo","Monto"],money:[1],r:R.tl.map(x=>[x[0],x[1]])},
    {t:"Productos más rentables",h:["Producto","Unidades","Vendido","Ganancia","Margen %"],money:[2,3],r:R.pl.map(x=>[x.n,x.u,x.ing,x.gan,x.ing?Math.round(x.gan/x.ing*1000)/10:0])},
    {t:"Flujo de caja por día",h:["Día","Entradas","Salidas","Neto"],money:[1,2,3],r:R.fk.map(d=>[fd(d),R.fl[d].i,R.fl[d].o,R.fl[d].i-R.fl[d].o])},
    {t:"Ventas por estado",h:["Estado","Cantidad"],money:[],r:[["Pagadas",R.ec.Pagada],["Parciales",R.ec.Parcial],["Pendientes",R.ec.Pendiente]]},
    {t:"Ventas por vendedor",h:["Vendedor","Ventas","Total vendido"],money:[2],r:R.pv.map(x=>[x.n,x.c,x.t])},
    {t:"Cuentas por cobrar",h:["Venta","Fecha","Cliente","Sucursal","Total","Pagado","Saldo"],money:[4,5,6],r:R.cxc.map(v=>[vnum(v),fd(v.fecha),cliName(v),sucName(v.sucId),v.total,pagado(v),saldo(v)])}
  ]};
}
const fileBase=()=>"reporte-"+(db.negocio.nombre||"negocio").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+today();
function repCSV(){
  const {R,T}=repTables();
  const q=v=>{const s=String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  let out=db.negocio.nombre+"\nReporte del "+fd(R.a)+" al "+fd(R.b)+" · Sucursal: "+R.suc+" · Montos en "+db.negocio.moneda+"\n";
  T.forEach(t=>{out+="\n"+t.t+"\n"+t.h.map(q).join(",")+"\n";t.r.forEach(r=>{out+=r.map((v,i)=>q(t.money.indexOf(i)>=0?cs(v):v)).join(",")+"\n";});if(!t.r.length)out+="(sin datos)\n";});
  return out;
}
const libs={};
function loadScript(src){
  if(libs[src])return libs[src];
  libs[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=()=>res();s.onerror=()=>{delete libs[src];s.remove();rej(new Error("load"));};document.head.appendChild(s);});
  return libs[src];
}
async function dlSave(filename,data){
  try{await dl.save({filename:filename,data:data});toast("Archivo listo: "+filename);}
  catch(e){if(e&&e.code==="declined")return;toast("No se pudo descargar el archivo");}
}
async function expXlsx(btn){
  btn.disabled=true;
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const {R,T}=repTables();const wb=XLSX.utils.book_new();
    T.forEach((t,ti)=>{
      const rows=t.r.map(r=>r.map((v,i)=>t.money.indexOf(i)>=0?Math.round(v)/100:v));
      const head=ti===0?[[db.negocio.nombre],["Período",fd(R.a)+" al "+fd(R.b)],["Sucursal",R.suc],["Moneda",db.negocio.moneda],[]]:[];
      const ws=XLSX.utils.aoa_to_sheet(head.concat([t.h],rows));
      ws["!cols"]=t.h.map((h,i)=>({wch:i===0?34:14}));
      XLSX.utils.book_append_sheet(wb,ws,t.t.slice(0,31));
    });
    const data=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    await dlSave(fileBase()+".xlsx",new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  }catch(e){toast("No se pudo preparar el Excel (revisa la conexión)");}
  btn.disabled=false;
}
async function expPdf(btn){
  btn.disabled=true;
  try{
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js");
    const {R,T}=repTables();
    const doc=new window.jspdf.jsPDF({unit:"pt",format:"a4"});
    doc.setFontSize(16);doc.text(db.negocio.nombre,40,48);
    doc.setFontSize(10);doc.text("Reporte del "+fd(R.a)+" al "+fd(R.b)+"  -  Sucursal: "+R.suc,40,66);
    let y=92;
    T.forEach(t=>{
      if(y>740){doc.addPage();y=50;}
      doc.setFontSize(12);doc.text(t.t,40,y);
      const body=t.r.length?t.r.map(r=>r.map((v,i)=>t.money.indexOf(i)>=0?m(v):(t.h[i]==="Margen %"?v.toFixed(1)+"%":String(v)))):[[{content:"Sin datos",colSpan:t.h.length}]];
      doc.autoTable({startY:y+6,head:[t.h],body:body,theme:"grid",styles:{fontSize:9,cellPadding:4},headStyles:{fillColor:[31,90,230]},margin:{left:40,right:40},
        columnStyles:Object.fromEntries(t.h.map((h,i)=>[i,{halign:i===0?"left":"right"}]))});
      y=doc.lastAutoTable.finalY+26;
    });
    await dlSave(fileBase()+".pdf",doc.output("arraybuffer"));
  }catch(e){toast("No se pudo preparar el PDF (revisa la conexión)");}
  btn.disabled=false;
}

AFTER.negocio=()=>{
  const prev=()=>{$("#nPrev").textContent=($("#nMon").value.trim()||"B/.")+" "+num(123450);};
  $("#nMon").oninput=prev;
  document.querySelectorAll("#main [data-cur]").forEach(b=>b.onclick=()=>{$("#nMon").value=b.dataset.cur;prev();});
  $("#nLogo").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;resizeImg(f,url=>{ctx.logo=url;$("#lgPrev").innerHTML='<img src="'+url+'" alt="Logo">';$("#lgTxt").textContent="Cambiar logo (toca Guardar)";});};
  const ld=$("#lgDel");if(ld)ld.onclick=()=>{ctx.logo=null;$("#lgPrev").innerHTML=ic("cam");$("#lgTxt").textContent="Agregar logo (toca Guardar)";ld.remove();};
  $("#nForm").onsubmit=e=>{e.preventDefault();const n=db.negocio;n.nombre=$("#nNom").value.trim()||"Mi negocio";n.moneda=$("#nMon").value.trim()||"B/.";n.logo=ctx.logo;n.sinStock=$("#nSin").checked;save();toast("Datos guardados");render();};
  $("#bkCopy").onclick=()=>copyText(JSON.stringify(db));
  const bl=$("#bkLoad");
  bl.onclick=()=>{
    let o;try{o=JSON.parse($("#bkTxt").value.trim());}catch(e){toast("El texto no es un respaldo válido");return;}
    if(!o||typeof o!=="object"||!o.negocio||!Array.isArray(o.usuarios)||!Array.isArray(o.productos)||!Array.isArray(o.ventas)){toast("El texto no es un respaldo válido");return;}
    if(!dosToques(bl,"Toca otra vez para reemplazar todo"))return;
    db=normalize(o);save();ctx.nv=null;toast("Respaldo restaurado");logout();
  };
};

function afterLoad(){
  closeSheet();
  if(me){
    me=byId(db.usuarios,me.id)||null;

    render();return;
  }
  if(loginVisible()){drawLogin();return;}
  const id=ss("iv_user");const u=id&&byId(db.usuarios,id);
  if(u)login(u);else showLogin();
}
